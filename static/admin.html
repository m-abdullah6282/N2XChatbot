<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N2X Admin Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
  body { background: #f1f5f9; color: #0f172a; }
  header { background: #1e3a8a; color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 1.3em; }
  header a { color: #c7d2fe; text-decoration: none; font-size: 14px; }
  .tabs { display: flex; background: #fff; border-bottom: 1px solid #e2e8f0; padding: 0 24px; }
  .tab { padding: 14px 22px; cursor: pointer; border: none; background: none; font-size: 15px; font-weight: 600; color: #64748b; border-bottom: 3px solid transparent; }
  .tab.active { color: #1e3a8a; border-bottom-color: #2563eb; }
  main { max-width: 900px; margin: 24px auto; padding: 0 24px; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
  .card h2 { font-size: 1.1em; margin-bottom: 14px; color: #1e3a8a; }
  .btn { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #1d4ed8; }
  .btn.danger { background: #dc2626; padding: 6px 12px; font-size: 13px; }
  .btn.danger:hover { background: #b91c1c; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn.logout { background: #475569; padding: 6px 14px; font-size: 13px; }
  .btn.logout:hover { background: #334155; }
  .input { width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none; }
  .input:focus { border-color: #2563eb; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e2e8f0; }
  th { color: #64748b; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; }
  .msg { padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; display: none; }
  .msg.show { display: block; }
  .msg.ok { background: #dcfce7; color: #166534; }
  .msg.err { background: #fee2e2; color: #991b1b; }
  .dropzone { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 40px; text-align: center; color: #64748b; cursor: pointer; transition: all 0.15s ease; }
  .dropzone.drag { border-color: #2563eb; background: #eff6ff; }
  .chat-row { padding: 12px 14px; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 10px; }
  .chat-row .meta { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
  .chat-row .line { margin: 4px 0; font-size: 14px; }
  .chat-row .line .who { font-weight: 700; }
  .chat-row .line.user .who { color: #2563eb; }
  .chat-row .line.bot .who { color: #059669; }
  .empty { color: #94a3b8; font-size: 14px; padding: 12px 0; }
  .row-flex { display: flex; gap: 8px; align-items: center; }
  .key-value { font-family: Consolas, monospace; background: #f1f5f9; padding: 4px 8px; border-radius: 6px; font-size: 13px; word-break: break-all; }
</style>
</head>
<body>

<header>
  <h1>N2X Admin Panel</h1>
  <div class="row-flex">
    <a href="/">Back to site</a>
    <button id="logoutBtn" class="btn logout">Logout</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="kb">Knowledge Base</button>
  <button class="tab" data-tab="history">Chat History</button>
  <button class="tab" data-tab="keys">API Keys</button>
</div>

<main>

  <!-- Knowledge Base -->
  <section id="kb" class="panel active">
    <div class="card">
      <h2>Upload Document</h2>
      <div id="dropzone" class="dropzone">Drag & drop PDF/TXT file yahan, ya click karke select karo</div>
      <div id="uploadMsg" class="msg"></div>
    </div>
    <div class="card">
      <h2>Uploaded Documents</h2>
      <table>
        <thead><tr><th>Filename</th><th>Size</th><th></th></tr></thead>
        <tbody id="docsBody"></tbody>
      </table>
      <div id="docsEmpty" class="empty" style="display:none;">Koi document upload nahi hua.</div>
    </div>
  </section>

  <!-- Chat History -->
  <section id="history" class="panel">
    <div class="card">
      <h2>Conversations</h2>
      <div id="convBody"></div>
    </div>
  </section>

  <!-- API Keys -->
  <section id="keys" class="panel">
    <div class="card">
      <h2>Generate API Key</h2>
      <div class="row-flex">
        <input id="keyLabel" class="input" placeholder="Client ka naam (label)" />
        <button id="genKeyBtn" class="btn">Generate</button>
      </div>
      <div id="keyMsg" class="msg"></div>
    </div>
    <div class="card">
      <h2>Existing Keys</h2>
      <table>
        <thead><tr><th>ID</th><th>API Key</th><th>Label</th><th>Created</th><th></th></tr></thead>
        <tbody id="keysBody"></tbody>
      </table>
      <div id="keysEmpty" class="empty" style="display:none;">Abhi koi API key nahi banai.</div>
    </div>
  </section>

</main>

<script>
  const API_BASE = "";
  const $ = (id) => document.getElementById(id);

  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
      document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
      tab.classList.add("active");
      $("kb").classList.toggle("active", tab.dataset.tab === "kb");
      $("history").classList.toggle("active", tab.dataset.tab === "history");
      $("keys").classList.toggle("active", tab.dataset.tab === "keys");
      if (tab.dataset.tab === "history") loadConversations();
      if (tab.dataset.tab === "keys") loadKeys();
    });
  });

  function showMsg(el, text, type) {
    el.textContent = text;
    el.className = "msg show " + type;
    setTimeout(() => el.classList.remove("show"), 5000);
  }

  async function api(path, options) {
    const res = await fetch(API_BASE + path, options);
    if (res.status === 401) {
      window.location.href = "/login";
      throw new Error("Not authenticated");
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || "Request failed");
    return data;
  }

  $("logoutBtn").onclick = async () => {
    try { await api("/admin/logout", { method: "POST" }); } catch (e) {}
    window.location.href = "/login";
  };

  async function checkAuth() {
    try {
      const data = await fetch("/admin/check").then((r) => r.json());
      if (!data.authenticated) window.location.href = "/login";
    } catch (e) {
      window.location.href = "/login";
    }
  }
  checkAuth();

  // ---------- Knowledge Base ----------

  const dropzone = $("dropzone");
  dropzone.addEventListener("click", () => {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".pdf,.txt";
    input.onchange = () => uploadFile(input.files[0]);
    input.click();
  });
  ["dragover", "dragenter"].forEach((ev) =>
    dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.add("drag"); })
  );
  ["dragleave", "drop"].forEach((ev) =>
    dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.remove("drag"); })
  );
  dropzone.addEventListener("drop", (e) => {
    const file = e.dataTransfer.files[0];
    if (file) uploadFile(file);
  });

  async function uploadFile(file) {
    if (!file) return;
    if (!/\.(pdf|txt)$/i.test(file.name)) {
      showMsg($("uploadMsg"), "Sirf PDF ya TXT file allow hai.", "err");
      return;
    }
    const formData = new FormData();
    formData.append("file", file);
    try {
      const data = await api("/upload", { method: "POST", body: formData });
      showMsg($("uploadMsg"), data.message + " (" + data.chunks_created + " chunks)", "ok");
      loadDocuments();
    } catch (err) {
      showMsg($("uploadMsg"), "Upload failed: " + err.message, "err");
    }
  }

  async function loadDocuments() {
    try {
      const docs = await api("/documents");
      const body = $("docsBody");
      body.innerHTML = "";
      $("docsEmpty").style.display = docs.length ? "none" : "block";
      docs.forEach((d) => {
        const tr = document.createElement("tr");
        const size = d.size > 1024 ? (d.size / 1024).toFixed(1) + " KB" : d.size + " B";
        tr.innerHTML = `<td>${d.filename}</td><td>${size}</td>
          <td><button class="btn danger">Delete</button></td>`;
        tr.querySelector("button").onclick = async () => {
          try {
            await api("/documents/" + encodeURIComponent(d.filename), { method: "DELETE" });
            loadDocuments();
          } catch (err) { alert(err.message); }
        };
        body.appendChild(tr);
      });
    } catch (err) {
      $("docsEmpty").style.display = "block";
      $("docsEmpty").textContent = "Error loading documents: " + err.message;
    }
  }

  // ---------- Chat History ----------

  async function loadConversations() {
    try {
      const rows = await api("/conversations");
      const bySession = {};
      rows.forEach((r) => {
        (bySession[r.session_id] = bySession[r.session_id] || []).push(r);
      });
      const body = $("convBody");
      body.innerHTML = "";
      const sessions = Object.keys(bySession);
      if (!sessions.length) {
        body.innerHTML = '<div class="empty">Abhi koi conversation nahi hai.</div>';
        return;
      }
      sessions.forEach((sid) => {
        const wrap = document.createElement("div");
        wrap.className = "chat-row";
        const first = bySession[sid][0];
        wrap.innerHTML = `<div class="meta">${sid} &middot; started ${first.created_at}</div>`;
        bySession[sid].forEach((r) => {
          const line = document.createElement("div");
          line.className = "line " + r.role;
          line.innerHTML = `<span class="who">${r.role === "user" ? "User:" : "Bot:"}</span> ${r.content}`;
          wrap.appendChild(line);
        });
        body.appendChild(wrap);
      });
    } catch (err) {
      $("convBody").innerHTML = '<div class="empty">Error loading history: ' + err.message + "</div>";
    }
  }

  // ---------- API Keys ----------

  $("genKeyBtn").onclick = async () => {
    const label = $("keyLabel").value.trim();
    if (!label) {
      showMsg($("keyMsg"), "Pehle client ka label likho.", "err");
      return;
    }
    try {
      const data = await api("/api-keys", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ label }),
      });
      $("keyLabel").value = "";
      showMsg($("keyMsg"), "Nayi API key: " + data.api_key, "ok");
      loadKeys();
    } catch (err) {
      showMsg($("keyMsg"), err.message, "err");
    }
  };

  async function loadKeys() {
    try {
      const keys = await api("/api-keys");
      const body = $("keysBody");
      body.innerHTML = "";
      $("keysEmpty").style.display = keys.length ? "none" : "block";
      keys.forEach((k) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${k.id}</td><td class="key-value">${k.api_key}</td>
          <td>${k.label}</td><td>${k.created_at}</td>
          <td><button class="btn danger">Delete</button></td>`;
        tr.querySelector("button").onclick = async () => {
          try {
            await api("/api-keys/" + k.id, { method: "DELETE" });
            loadKeys();
          } catch (err) { alert(err.message); }
        };
        body.appendChild(tr);
      });
    } catch (err) {
      $("keysEmpty").style.display = "block";
      $("keysEmpty").textContent = "Error loading keys: " + err.message;
    }
  }

  loadDocuments();
</script>
</body>
</html>
